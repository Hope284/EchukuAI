name: Deploy DZEVA Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dzeva-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, mbstring, pdo_sqlite, sodium, sqlite3, zip
          coverage: none

      - name: Install validation dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate PHP syntax
        run: find app config database packages routes resources/views tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate extension manifests
        run: find app/Extensions -type f -name 'extension.json' -print0 | xargs -0 -n1 jq empty

      - name: Reject committed provider secrets
        shell: bash
        run: |
          set -euo pipefail
          leaked_files="$(git grep -IlE 'AIza[0-9A-Za-z_-]{20,}|sk_(live|test)_[0-9A-Za-z]{16,}' -- app config resources public/themes/default routes .env.example || true)"
          if [ -n "$leaked_files" ]; then
            echo "Provider credentials were found in tracked source files:"
            printf '%s\n' "$leaked_files"
            exit 1
          fi

      - name: Run Laravel tests
        run: php artisan test

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /var/www/dzeva

            dirty_files="$(git status --porcelain)"
            if [ -n "$dirty_files" ]; then
              allowed_dirty_pattern='^[[:space:]]*[MADRCUD?]{1,2}[[:space:]]+(version\.txt|public/vendor/|public/images/integrations/)'
              unsafe_dirty="$(printf '%s\n' "$dirty_files" | grep -Ev "$allowed_dirty_pattern" || true)"

              if [ -z "$unsafe_dirty" ]; then
                echo "Production has only generated deployment artifacts changed; preserving them before deployment."
                generated_artifacts_backup="$(mktemp -d)"
                printf '%s\n' "$dirty_files" > "$generated_artifacts_backup/git-status.txt"
                if [ -f version.txt ]; then
                  cp version.txt "$generated_artifacts_backup/version.txt.production-before-deploy"
                fi

                stash_paths=()
                [ -e version.txt ] && stash_paths+=(version.txt)
                [ -e public/vendor ] && stash_paths+=(public/vendor)
                [ -e public/images/integrations ] && stash_paths+=(public/images/integrations)

                if [ "${#stash_paths[@]}" -gt 0 ]; then
                  git stash push --include-untracked -m "dzeva deployment preserved generated artifacts $(date -u +%Y%m%d-%H%M%S)" -- "${stash_paths[@]}"
                fi
              else
                echo "Production worktree has uncommitted changes; deployment stopped."
                git status --short
                exit 1
              fi
            fi

            if [ -n "$(git status --porcelain)" ]; then
              echo "Production worktree has uncommitted changes; deployment stopped."
              git status --short
              exit 1
            fi

            sudo systemctl stop cron || true
            trap 'sudo systemctl start cron || true' EXIT

            backup_stamp="$(date -u +%Y%m%d-%H%M%S)"
            backup_dir="/home/ubuntu/backups/dzeva-fix-${backup_stamp}"
            sudo install -d -o ubuntu -g ubuntu -m 0700 "$backup_dir"
            git rev-parse HEAD > "$backup_dir/commit.txt"
            if [ -n "${generated_artifacts_backup:-}" ] && [ -d "$generated_artifacts_backup" ]; then
              install -d -m 0700 "$backup_dir/generated-artifacts-before-deploy"
              cp -a "$generated_artifacts_backup/." "$backup_dir/generated-artifacts-before-deploy/"
              rm -rf "$generated_artifacts_backup"
            fi
            tar \
              --exclude='./.git' \
              --exclude='./.env' \
              --exclude='./vendor' \
              --exclude='./node_modules' \
              --exclude='./storage' \
              --exclude='./public/uploads' \
              --exclude='./public/upload' \
              -czf "$backup_dir/app.tar.gz" .
            [ ! -d storage ] || tar -czf "$backup_dir/storage.tar.gz" storage
            [ ! -d public/uploads ] || tar -czf "$backup_dir/public-uploads.tar.gz" public/uploads
            [ ! -d public/upload ] || tar -czf "$backup_dir/public-upload.tar.gz" public/upload
            [ ! -d public/vendor ] || tar -czf "$backup_dir/public-extension-assets.tar.gz" public/vendor
            install -m 0600 .env "$backup_dir/.env.backup"

            db_host="$(php -r '$e=parse_ini_file(".env", false, INI_SCANNER_RAW); echo $e["DB_HOST"] ?? "127.0.0.1";')"
            db_port="$(php -r '$e=parse_ini_file(".env", false, INI_SCANNER_RAW); echo $e["DB_PORT"] ?? "3306";')"
            db_name="$(php -r '$e=parse_ini_file(".env", false, INI_SCANNER_RAW); echo $e["DB_DATABASE"] ?? "";')"
            db_user="$(php -r '$e=parse_ini_file(".env", false, INI_SCANNER_RAW); echo $e["DB_USERNAME"] ?? "";')"
            db_password="$(php -r '$e=parse_ini_file(".env", false, INI_SCANNER_RAW); echo $e["DB_PASSWORD"] ?? "";')"

            if [ -z "$db_name" ] || [ -z "$db_user" ]; then
              echo "Database backup configuration is incomplete."
              exit 1
            fi

            MYSQL_PWD="$db_password" mysqldump \
              --single-transaction \
              --quick \
              --no-tablespaces \
              --skip-lock-tables \
              --host="$db_host" \
              --port="$db_port" \
              --user="$db_user" \
              "$db_name" | gzip > "$backup_dir/database.sql.gz"
            chmod 0600 "$backup_dir/database.sql.gz"
            echo "Production backup created at $backup_dir"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            fix_laravel_permissions() {
              sudo install -d -o ubuntu -g www-data -m 2775 public public/vendor public/vendor/chatbot public/vendor/chatbot/js public/vendor/chatbot/images public/vendor/chatbot/icons storage/framework/cache/data storage/framework/cache/locks storage/framework/views storage/framework/sessions storage/framework/testing bootstrap/cache public/uploads public/uploads/media public/uploads/media/images public/uploads/media/videos public/uploads/media/other public/uploads/media/others public/uploads/media/voices public/uploads/guest public/uploads/thumbnail/default public/upload public/upload/images public/upload/images/avatar public/upload/images/blog vendor/magicai/magicai-healthy/resources/views
              sudo chown ubuntu:www-data public
              sudo chmod 2775 public
              sudo chown -R ubuntu:www-data storage bootstrap/cache public/uploads public/upload public/vendor vendor/magicai/magicai-healthy/resources/views
              sudo find storage bootstrap/cache public/uploads public/upload public/vendor -type d -exec chmod 2775 {} \;
              sudo find storage bootstrap/cache public/uploads public/upload public/vendor -type f -exec chmod 664 {} \;
              if ! command -v setfacl >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y acl
              fi
              sudo setfacl -m u:ubuntu:rwx,u:www-data:rwx,g:www-data:rwx,m:rwx public
              sudo setfacl -d -m u:ubuntu:rwx,u:www-data:rwx,g:www-data:rwx,m:rwx public
              sudo setfacl -R -m u:ubuntu:rwx,u:www-data:rwx,g:www-data:rwx,m:rwx storage bootstrap/cache public/uploads public/upload public/vendor
              sudo setfacl -R -d -m u:ubuntu:rwx,u:www-data:rwx,g:www-data:rwx,m:rwx storage bootstrap/cache public/uploads public/upload public/vendor
            }
            fix_laravel_permissions
            php -m | grep -E '^pdo_mysql$'
            php -m | grep -E '^sodium$'
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan vendor:publish --tag=extension --force
            fix_laravel_permissions
            sudo -u www-data php artisan db:seed --class=DzevaPlanSeeder --force
            sudo -u www-data php artisan dzeva:sync-premium-entitlements
            sudo -u www-data php artisan plans:ensure-gateway-products --gateway=paystack --type=subscription --refresh
            sudo -u www-data php artisan optimize:clear
            fix_laravel_permissions
            sudo -u www-data php artisan config:cache
            sudo -u www-data php artisan route:clear
            sudo -u www-data php artisan route:list --path=strategic
            sudo -u www-data php artisan route:list --path=partner
            sudo -u www-data php artisan route:list --path=affiliate
            sudo -u www-data php artisan route:list --path=webhooks
            sudo -u www-data php artisan route:list --path=paystack
            sudo -u www-data php artisan dzeva:production-audit
            cron_line='* * * * * cd /var/www/dzeva && php artisan schedule:run >> /dev/null 2>&1'
            (crontab -l 2>/dev/null | grep -Fv 'cd /var/www/dzeva && php artisan schedule:run' || true; printf '%s\n' "$cron_line") | crontab -
            crontab -l | grep -F 'cd /var/www/dzeva && php artisan schedule:run'
            sudo -u www-data php artisan schedule:list
            sudo -u www-data php artisan view:cache
            sudo -u www-data php artisan theme:refresh-cache || true
            fix_laravel_permissions
            php artisan queue:restart || true
            sudo supervisorctl restart dzeva-worker:* || true
            sudo systemctl reload nginx
            sudo systemctl restart php8.3-fpm

      - name: Verify live routes
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local url="$1"
            local status
            status="$(curl --silent --show-error --location --max-time 45 --output /dev/null --write-out '%{http_code}' "$url")"
            echo "$url -> $status"
            case "$status" in
              200|301|302|303|307|308) ;;
              *) exit 1 ;;
            esac
          }

          check_url "https://dzeva.com"
          check_url "https://dzeva.com/login"
          check_url "https://dzeva.com/register"
          check_url "https://dzeva.com/chat"
          check_url "https://dzeva.com/blog"
          check_url "https://dzeva.com/sitemap.xml"
          check_url "https://dzeva.com/update-manual"
          check_url "https://dzeva.com/dashboard/user/strategic-partner"
          check_url "https://dzeva.com/dashboard/admin/strategic-partners"
          check_url "https://dzeva.com/dashboard/admin/strategic-partners/create"
          check_url "https://dzeva.com/partner/invalid-code"
