name: Deploy DZEVA Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dzeva-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/dzeva
            sudo systemctl stop cron || true
            trap 'sudo systemctl start cron || true' EXIT
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            fix_laravel_permissions() {
              sudo install -d -o ubuntu -g www-data -m 2775 storage/framework/cache/data storage/framework/cache/locks storage/framework/views storage/framework/sessions storage/framework/testing bootstrap/cache public/uploads public/uploads/media public/uploads/media/images public/uploads/media/videos public/uploads/media/other public/uploads/media/others public/uploads/media/voices public/uploads/guest public/uploads/thumbnail/default vendor/magicai/magicai-healthy/resources/views
              sudo chown -R ubuntu:www-data storage bootstrap/cache public/uploads vendor/magicai/magicai-healthy/resources/views
              sudo find storage bootstrap/cache public/uploads -type d -exec chmod 2775 {} \;
              sudo find storage bootstrap/cache public/uploads -type f -exec chmod 664 {} \;
              if ! command -v setfacl >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y acl
              fi
              sudo setfacl -R -m u:ubuntu:rwx,u:www-data:rwx,g:www-data:rwx,m:rwx storage bootstrap/cache public/uploads
              sudo setfacl -R -d -m u:ubuntu:rwx,u:www-data:rwx,g:www-data:rwx,m:rwx storage bootstrap/cache public/uploads
            }
            fix_laravel_permissions
            php -m | grep -E '^pdo_mysql$'
            php -m | grep -E '^sodium$'
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            php artisan migrate --force
            sudo -u www-data php artisan db:seed --class=DzevaPlanSeeder --force
            sudo -u www-data php artisan optimize:clear
            fix_laravel_permissions
            sudo -u www-data php artisan config:cache
            sudo -u www-data php artisan route:clear
            sudo -u www-data php artisan route:list --path=webhooks
            sudo -u www-data php artisan route:list --path=paystack
            sudo -u www-data php artisan view:cache
            sudo -u www-data php artisan theme:refresh-cache || true
            fix_laravel_permissions
            php artisan queue:restart || true
            sudo supervisorctl restart dzeva-worker:* || true
            sudo systemctl reload nginx
            sudo systemctl restart php8.3-fpm
